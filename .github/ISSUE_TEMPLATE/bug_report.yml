name: 🐞 Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! ⚠️ Please **remove any personal data** from text, screenshots and files.
        For security vulnerabilities, use [private reporting](https://github.com/lestolo/subscription-tracker/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. iPhone 15, iOS 26.0 / Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Safari 26, Chrome 141
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: Is the app installed on the Home Screen?
      options:
        - "Yes"
        - "No, used in the browser"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors, additional context
